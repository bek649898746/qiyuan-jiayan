# Dependabot — 依赖与 GitHub Actions 的自动更新
#
# 为什么要有这个文件：
#   ① 开源评估的 `Dependency-Update-Tool` 项需要「项目声明了自动依赖更新机制」这一可验证信号
#   ② 本项目的唯一「依赖」是 GitHub Actions 的 action 版本 —— 让它自动跟着升级，
#      比人工盯着 changelog 更不容易漏掉安全修复
#
# 注意：甲言编译器本身**零外部依赖**（不需 gcc、不需 Python 运行编译器），
#      所以这里只登记 github-actions 生态。Python 脚本仅用于测试与校验，不在编译器运行路径上。

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Shanghai"
    # 2026-11-04：**本仓库主动把所有 action 钉在 commit SHA 上**（防上游 tag 移动改变构建行为，
    # 见 .github/workflows/*.yml 的 `uses: ...@<40位 SHA>`）。dependabot 的版本建议基于 tag，
    # 与这种策略天然冲突 —— 它提出的升级（例如 checkout 5→7）无法安全自动应用，
    # 会长期积压成一堆未处理 PR，反而给外部读者"项目不处理输入"的错觉。
    # ⟹ 关掉版本更新 PR，只保留安全公告通道；升级仍以人工按 SHA 更新为准。
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
