# 启元甲言 CI — 每次 push/PR 自动验证闭环
# 验证: 宿主编译(gcc 零警告) → 行为断言 → 多文件链接 → 自举不动点 (v2==v3==v4)
name: qiyuan-ci

on:
  push:
    branches: [ master, main, publish ]   # publish = 默认分支（补 2026-10-20）
  pull_request:
    branches: [ master, main, publish ]   # publish = 默认分支（补 2026-10-20）
  # ── 完整自举（20.8 分钟）不适合每次 push 跑，改为 nightly + 手动 ──
  #    这是全链唯一无法在 90 秒自证/九线/1,425 锚里覆盖的验收点：
  #    「v1 == v2 == $expected」只有真跑完两代自举才能判。
  schedule:
    - cron: '0 18 * * *'                  # 每天 UTC 18:00 = 北京时间 02:00
  workflow_dispatch:                       # 维护者手动触发（网页 Run workflow）

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 编译宿主编译器 (gcc 零警告)
        run: gcc -O2 -Wall -Werror srclib/qcc_x86.c -o qcc_x86.exe

      - name: 编码检查 (源文件必须严格 UTF-8)
        run: python scripts/check_encoding.py .

      - name: 编译器自检
        run: .\qcc_x86.exe --test

      # ── 行为断言：push/PR 只跑快速集，全量挪到 nightly ────────────────
      # 2026-10-21：全量 377 个测试串行实测 969 秒（16.2 分钟），每次都跑偏重。
      # 快速集 30 个关键用例 19 秒，覆盖类型/布局/变参/控制流/指针/字符串/数组。
      # 全量在下方 nightly_full job（schedule / workflow_dispatch 才跑）。
      - name: 行为断言（快速集 30 个 · 全量 377 个在 nightly）
        run: python scripts/run_tests.py --fast

      - name: 多 .o 链接 + jycc 验收 (6 项)
        run: python scripts/test_multifile.py

  zh_chain:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # ── 中文主链验证（对外唯一推荐路径）──
      # 注：历史英文链 build.ps1 已从对外路径撤出 —— 它编译废弃镜像 qcc_work.jy，
      #     且在非仓库根目录会静默产出缺运行库的残缺编译器（rc 仍 0，运行即 0xC0000005）。
      #     详见 README「已知问题与口径说明」第 1 条。

      - name: 中文链 90 秒自证（零依赖 · 不需要 gcc）
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/verify_90s.ps1

      - name: 九条语言线（85 文件归档 · 每线 1 个入口被编译运行 = 9/9）
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/verify_multilang.ps1

      - name: 中文特性锚（1,425 个 feat_zh_*.c）
        run: python scripts/run_tests_zh.py --zh-feat

  qemu:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5

      - name: 编译宿主编译器
        run: gcc -O2 -Wall -Werror srclib/qcc_x86.c -o qcc_x86.exe

      - name: WSL 安装 QEMU (渐进式, 失败不阻塞)
        continue-on-error: true
        run: wsl -e bash -c "sudo apt-get update && sudo apt-get install -y qemu-system-x86 binutils"

      - name: QEMU 内核验证 (NVMe 环回 LOOPBACK-PASS)
        continue-on-error: true
        run: wsl -e bash scripts/_qemu_kernel.sh kernel_v36

  asmzh:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 编译宿主汇编器
        run: gcc -O2 -Wall -Werror srclib/asm_zh.c -o asm_zh.exe

      - name: 编译宿主编译器
        run: gcc -O2 -Wall -Werror srclib/qcc_x86.c -o qcc_x86.exe

      # 2026-10-21 启元审计 D41：原版 `| Out-Null` 把编译输出全部吞掉，
      # 一旦失败日志只剩一句 "exit 1"，无法追因（10-21 run 该步骤 3 秒即红）。
      - name: asm_zh.jy 自宿主 (qcc 编译甲言版 → v2)
        shell: powershell
        run: |
          qcc_x86.exe srclib/asm_zh.jy -o build_asmzh_v2.exe
          $rc = $LASTEXITCODE
          Write-Host "qcc 退出码 = $rc"
          if ($rc -ne 0) { Write-Host "[FAIL] asm_zh.jy 编译失败 rc=$rc"; exit 1 }
          if (-not (Test-Path build_asmzh_v2.exe)) { Write-Host "[FAIL] 产物缺失"; exit 1 }
          Write-Host "asm_zh v2 编译 OK: $((Get-Item build_asmzh_v2.exe).Length) 字节"

      # 2026-10-21 启元审计 D41：原版是 `shell: powershell` + bash heredoc（python - <<'PY'）。
      # PowerShell 不支持 heredoc，实测报：
      #   Missing file specification after redirection operator.
      #   The '<' operator is reserved for future use.
      # ⟹ 该步骤必然红（与步骤6 是否修好无关）。改为调用独立脚本，不依赖任何 shell 特性。
      - name: 自宿主对齐 (host vs v2 产物 SHA)
        shell: powershell
        run: |
          $env:PYTHONIOENCODING='utf-8'
          python scripts/check_asmzh_selfhost.py

  # ══════════════════════════════════════════════════════════
  # 完整自举链 —— 全链唯一没被机器守护的验收点
  #
  # 为什么单独一个 job：跑一次 ~20.8 分钟（两代编译 + 不动点比对），
  # 塞进 push/PR 会把每次提交都拖到 20 分钟以上 ⟹ 只在 nightly/手动跑。
  #
  # 它验的是什么（90 秒自证 / 九线 / 1,425 锚全都覆盖不到）：
  #   v1 = qcc_zh_seed.exe 编 qcc_zh.jy
  #   v2 = qcc_zh_v1.exe   编 qcc_zh.jy
  #   判据 = v1 == v2 == $expected（build_zh.ps1 内硬失败，不等即 exit 1）
  #
  # 前置：只需要仓库自带的 qcc_zh_seed.exe（15.2 MB）
  #   —— 不需要 gcc 编宿主：`build_zh.ps1` 里 qcc_x86.exe 引用数 = 0，
  #      头注释第 2 步「qcc_x86.exe (英文种子)」是 2026-08 的过时注释。
  #   —— 默认跳过 sinicize.py（只有显式 -Regenerate 才从英文镜像重建主源）。
  #
  # 内存实测（本机 2026-10-21）：主源单代编译峰值 2,021 MB / 45 秒（-c），
  #   windows-latest runner 有 7 GB ⟹ 够。public 仓库 Actions 时长不计费。
  # ══════════════════════════════════════════════════════════
  bootstrap:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: 种子在位检查
        shell: powershell
        run: |
          if (-not (Test-Path qcc_zh_seed.exe)) { Write-Host "[FAIL] qcc_zh_seed.exe 不在仓库根目录"; exit 1 }
          $len = (Get-Item qcc_zh_seed.exe).Length
          $sha = (Get-FileHash qcc_zh_seed.exe -Algorithm SHA256).Hash
          Write-Host "种子: $len 字节 / SHA256 $($sha.Substring(0,16))…"

      - name: 完整自举链（两代 + 不动点比对 · 约 20.8 分钟）
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build_zh.ps1

      - name: 两代产物取证（失败也上传，便于追因）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-v1-v2
          path: |
            qcc_zh_v1.exe
            qcc_zh_v2.exe
          retention-days: 14
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════
  # 行为断言 · 全量 377 个 —— 与 bootstrap 并行跑（不同 runner，互不干扰）
  #
  # 为什么单独一个 job：全量实测 969 秒（16.2 分钟），塞进 push/PR 会把
  # 每次提交都拖到 20 分钟以上 ⟹ push 只跑 --fast（30 个/19 秒）兜关键路径，
  # 全量放到 nightly 兜回归。
  #
  # 2026-10-21 修复前这个 job 的形态是「跑不完」：
  #   run_tests.py 用英文链 qcc_x86.exe 编 regress_adt_typed.c 挂死（CPU≈0），
  #   且编译调用没有 timeout ⟹ CI 白跑 4 小时 20 分。
  #   修完后中文链 377/377 全过，16.2 分钟。详见 scripts/run_tests.py 顶部注释。
  # ══════════════════════════════════════════════════════════
  nightly_full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 中文主链种子在位检查
        shell: powershell
        run: |
          if (-not (Test-Path qcc_zh_seed.exe)) { Write-Host "[FAIL] 缺 qcc_zh_seed.exe"; exit 1 }
          Write-Host "种子在: $((Get-Item qcc_zh_seed.exe).Length) 字节"

      # 2026-10-21 启元审计 D41：scripts/test_multifile.py L30 硬写死 qcc_x86.exe，
      # 而本 job 原先没有编译它的步骤 ⟹ 冷环境必然 FileNotFoundError（隔离复现 1 秒，exit=1）。
      # 这正是「同一个脚本 tests 绿 / nightly_full 红」的唯一差别。
      - name: 编译宿主编译器（test_multifile.py 依赖 qcc_x86.exe）
        run: gcc -O2 -Wall -Werror srclib/qcc_x86.c -o qcc_x86.exe

      - name: 行为断言全量（377 个 · 约 16.2 分钟）
        run: python scripts/run_tests.py

      - name: 多 .o 链接 + jycc 验收
        run: python scripts/test_multifile.py


