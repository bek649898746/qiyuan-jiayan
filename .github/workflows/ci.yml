# 启元甲言 CI — 每次 push/PR 自动验证闭环
# 验证: 宿主编译(gcc 零警告) → 行为断言 → 多文件链接 → 自举不动点 (v2==v3==v4)
name: qiyuan-ci

on:
  push:
    branches: [ master, main, publish ]   # publish = 默认分支（补 2026-10-20）
  pull_request:
    branches: [ master, main, publish ]   # publish = 默认分支（补 2026-10-20）
  # ── 完整自举（20.8 分钟）不适合每次 push 跑，改为 nightly + 手动 ──
  #    这是全链唯一无法在 90 秒自证/九线/1,425 锚里覆盖的验收点：
  #    「v1 == v2 == $expected」只有真跑完两代自举才能判。
  schedule:
    - cron: '0 18 * * *'                  # 每天 UTC 18:00 = 北京时间 02:00
  workflow_dispatch:                       # 维护者手动触发（网页 Run workflow）

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 编译宿主编译器 (gcc 零警告)
        run: gcc -O2 -Wall -Werror srclib/qcc_x86.c -o qcc_x86.exe

      - name: 编码检查 (源文件必须严格 UTF-8)
        run: python scripts/check_encoding.py .

      - name: 编译器自检
        run: .\qcc_x86.exe --test

      - name: 行为断言
        run: python scripts/run_tests.py

      - name: 多 .o 链接 + jycc 验收 (6 项)
        run: python scripts/test_multifile.py

  zh_chain:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # ── 中文主链验证（对外唯一推荐路径）──
      # 注：历史英文链 build.ps1 已从对外路径撤出 —— 它编译废弃镜像 qcc_work.jy，
      #     且在非仓库根目录会静默产出缺运行库的残缺编译器（rc 仍 0，运行即 0xC0000005）。
      #     详见 README「已知问题与口径说明」第 1 条。

      - name: 中文链 90 秒自证（零依赖 · 不需要 gcc）
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/verify_90s.ps1

      - name: 九条语言线（85 文件归档 · 每线 1 个入口被编译运行 = 9/9）
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/verify_multilang.ps1

      - name: 中文特性锚（1,425 个 feat_zh_*.c）
        run: python scripts/run_tests_zh.py --zh-feat

  qemu:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5

      - name: 编译宿主编译器
        run: gcc -O2 -Wall -Werror srclib/qcc_x86.c -o qcc_x86.exe

      - name: WSL 安装 QEMU (渐进式, 失败不阻塞)
        continue-on-error: true
        run: wsl -e bash -c "sudo apt-get update && sudo apt-get install -y qemu-system-x86 binutils"

      - name: QEMU 内核验证 (NVMe 环回 LOOPBACK-PASS)
        continue-on-error: true
        run: wsl -e bash scripts/_qemu_kernel.sh kernel_v36

  asmzh:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 编译宿主汇编器
        run: gcc -O2 -Wall -Werror srclib/asm_zh.c -o asm_zh.exe

      - name: 编译宿主编译器
        run: gcc -O2 -Wall -Werror srclib/qcc_x86.c -o qcc_x86.exe

      - name: asm_zh.jy 自宿主 (qcc 编译甲言版 → v2)
        shell: powershell
        run: |
          qcc_x86.exe srclib/asm_zh.jy -o build_asmzh_v2.exe | Out-Null
          if (-not (Test-Path build_asmzh_v2.exe)) { exit 1 }
          Write-Host "asm_zh v2 编译 OK"

      - name: 自宿主对齐 (host vs v2 产物 SHA)
        shell: powershell
        run: |
          $env:PYTHONIOENCODING='utf-8'
          python - <<'PY'
          import subprocess, hashlib, os
          files = ['tests/behavior/b_scanf.c', 'tests/behavior/b_bitfield.c', 'tests/qcc/math_call_test.c']
          ok = 0
          for i, src in enumerate(files):
              base = f'szh_ci_{i}'
              r = subprocess.run(['qcc_x86.exe', '-S', src, '-o', base + '.asm'], capture_output=True)
              if r.returncode != 0 or not os.path.exists(base + '.asm.asm'):
                  raise SystemExit(f'{src}: qcc -S 失败')
              subprocess.run(['asm_zh.exe', base + '.asm.asm', '-o', base + '_h.exe'], capture_output=True, check=True)
              subprocess.run(['build_asmzh_v2.exe', base + '.asm.asm', '-o', base + '_v.exe'], capture_output=True, check=True, timeout=900)
              h1 = hashlib.sha256(open(base + '_h.exe', 'rb').read()).hexdigest()
              h2 = hashlib.sha256(open(base + '_v.exe', 'rb').read()).hexdigest()
              if h1 != h2:
                  raise SystemExit(f'{src}: host={h1[:16]} v2={h2[:16]} 不一致')
              ok += 1
              print(f'  {src}: MATCH')
          print(f'asm_zh 自宿主对齐: {ok}/{len(files)} 一致')
          PY

  # ══════════════════════════════════════════════════════════
  # 完整自举链 —— 全链唯一没被机器守护的验收点
  #
  # 为什么单独一个 job：跑一次 ~20.8 分钟（两代编译 + 不动点比对），
  # 塞进 push/PR 会把每次提交都拖到 20 分钟以上 ⟹ 只在 nightly/手动跑。
  #
  # 它验的是什么（90 秒自证 / 九线 / 1,425 锚全都覆盖不到）：
  #   v1 = qcc_zh_seed.exe 编 qcc_zh.jy
  #   v2 = qcc_zh_v1.exe   编 qcc_zh.jy
  #   判据 = v1 == v2 == $expected（build_zh.ps1 内硬失败，不等即 exit 1）
  #
  # 前置：只需要仓库自带的 qcc_zh_seed.exe（15.2 MB）
  #   —— 不需要 gcc 编宿主：`build_zh.ps1` 里 qcc_x86.exe 引用数 = 0，
  #      头注释第 2 步「qcc_x86.exe (英文种子)」是 2026-08 的过时注释。
  #   —— 默认跳过 sinicize.py（只有显式 -Regenerate 才从英文镜像重建主源）。
  #
  # 内存实测（本机 2026-10-21）：主源单代编译峰值 2,021 MB / 45 秒（-c），
  #   windows-latest runner 有 7 GB ⟹ 够。public 仓库 Actions 时长不计费。
  # ══════════════════════════════════════════════════════════
  bootstrap:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: 种子在位检查
        shell: powershell
        run: |
          if (-not (Test-Path qcc_zh_seed.exe)) { Write-Host "[FAIL] qcc_zh_seed.exe 不在仓库根目录"; exit 1 }
          $len = (Get-Item qcc_zh_seed.exe).Length
          $sha = (Get-FileHash qcc_zh_seed.exe -Algorithm SHA256).Hash
          Write-Host "种子: $len 字节 / SHA256 $($sha.Substring(0,16))…"

      - name: 完整自举链（两代 + 不动点比对 · 约 20.8 分钟）
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build_zh.ps1

      - name: 两代产物取证（失败也上传，便于追因）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-v1-v2
          path: |
            qcc_zh_v1.exe
            qcc_zh_v2.exe
          retention-days: 14
          if-no-files-found: warn

