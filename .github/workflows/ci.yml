# 启元·甲言 CI — 每次 push/PR 自动验证闭环 (Task 3.3)
# 验证: 编译器构建 (gcc 零警告) → 行为断言 → 自举不动点
# 拆分 2 job: tests(断言+多文件) + bootstrap(自举), 便于定位失败步骤
name: qiyuan-ci

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 编译宿主编译器 (gcc 零警告)
        run: gcc -O2 -Wall -Werror srclib/qcc_x86.c -o qcc_x86.exe

      - name: 编码检查 (源文件必须严格 UTF-8)
        run: python scripts/check_encoding.py .

      - name: 编译器自检
        run: .\qcc_x86.exe --test

      - name: CI 诊断 (PE 头 + 手动运行, 临时)
        if: always()
        continue-on-error: true
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Remove-Item scratch_test/_diag.exe -Force -ErrorAction SilentlyContinue
          Write-Host "=== 编译 arg4 ==="
          .\qcc_x86.exe tests/qcc/arg4.c -o scratch_test/_diag.exe 2>&1
          Write-Host "编译 rc=$LASTEXITCODE"
          if (Test-Path scratch_test/_diag.exe) {
            Write-Host "=== 文件大小 ==="
            (Get-Item scratch_test/_diag.exe).Length
            Write-Host "=== objdump PE 头 ==="
            objdump -x scratch_test/_diag.exe 2>&1 | Select-String -Pattern 'SizeOfImage|SizeOfRawData|VirtualSize|SizeOfStack|entry|DLL Name' | Select-Object -First 10 | ForEach-Object { $_.Line.Trim() }
            Write-Host "=== cmd 直接运行 ==="
            cmd /c "scratch_test\_diag.exe & echo rc=%ERRORLEVEL%" 2>&1
            Write-Host "=== python subprocess 运行 ==="
            python -c "import subprocess; p=subprocess.run([r'scratch_test\_diag.exe'],capture_output=True,text=True,timeout=15); print('rc=',p.returncode)"
          }

      - name: 行为断言 (180+)
        run: python scripts/run_tests.py

      - name: 多 .o 链接 + jycc 验收 (6 项)
        run: python scripts/test_multifile.py

  bootstrap:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 编译宿主编译器
        run: gcc -O2 -Wall -Werror srclib/qcc_x86.c -o qcc_x86.exe

      - name: 自举三代不动点
        shell: powershell
        run: |
          qcc_x86.exe srclib_jiayan/qcc_work.jy -o v1.exe | Out-Null
          .\v1.exe srclib_jiayan/qcc_work.jy -o v2.exe | Out-Null
          .\v2.exe srclib_jiayan/qcc_work.jy -o v3.exe | Out-Null
          $h1 = (Get-FileHash v1.exe -Algorithm SHA256).Hash
          $h2 = (Get-FileHash v2.exe -Algorithm SHA256).Hash
          $h3 = (Get-FileHash v3.exe -Algorithm SHA256).Hash
          Write-Host "v1: $h1"
          Write-Host "v2: $h2"
          Write-Host "v3: $h3"
          if (($h1 -eq $h2) -and ($h2 -eq $h3)) { Write-Host "自举v2==v3 OK" } else { Write-Host "自举v2!=v3"; exit 1 }
