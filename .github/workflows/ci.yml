# 启元·甲言 CI — 每次 push/PR 自动验证闭环 (Task 3.3)
# 验证: 编译器构建 (gcc 零警告) → 167 行为断言 → 多 .o/jycc 验收 → 自举不动点
name: qiyuan-ci

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'   # 临时改 3.11 验证: 3.12 subprocess 兼容性假设 (fix 2026-08-07)

      - name: 编译宿主编译器 (gcc 零警告)
        run: gcc -O2 -Wall -Werror srclib/qcc_x86.c -o qcc_x86.exe

      - name: 编码检查 (源文件必须严格 UTF-8)
        run: python scripts/check_encoding.py .

      - name: 编译器自检
        run: .\qcc_x86.exe --test

      - name: 行为断言 (180+)
        run: python scripts/run_tests.py

      - name: CI 诊断 (环境 + 失败详情) — 临时, 修绿后移除
        if: always()
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host "=== gcc 版本 ==="
          gcc --version | Select-Object -First 1
          Write-Host "=== Python 版本 ==="
          python --version
          Write-Host "=== 手动编译运行 arg4.c (诊断) ==="
          .\qcc_x86.exe tests/qcc/arg4.c -o scratch_test/_diag.exe
          Write-Host "编译 rc=$LASTEXITCODE"
          if (Test-Path scratch_test/_diag.exe) {
            Write-Host "=== objdump PE 头 ==="
            objdump -x scratch_test/_diag.exe 2>&1 | Select-String -Pattern 'SizeOfImage|StackReserve|StackCommit|HeapReserve|entry|DLL Name'
            Write-Host "=== 直接运行 (cmd) ==="
            cmd /c "scratch_test\_diag.exe & echo rc=%ERRORLEVEL%"
            Write-Host "=== python subprocess 运行 ==="
            python -c "import subprocess; p=subprocess.run([r'scratch_test\_diag.exe'],capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=15); print('rc=',p.returncode,'out=',repr(p.stdout[:60]),'err=',repr(p.stderr[:60]))"
            Write-Host "=== 模拟 run_tests.py 完整 (编译 arg4 到 _H1.exe + subprocess) ==="
            python -c "import subprocess,os; os.remove(r'scratch_test\_diag_H1.exe') if os.path.exists(r'scratch_test\_diag_H1.exe') else None; r=subprocess.run([r'qcc_x86.exe',r'tests/qcc/arg4.c','-o',r'scratch_test\_diag_H1.exe'],capture_output=True,text=True,encoding='utf-8',errors='replace'); print('compile rc=',r.returncode,'out=',repr(r.stdout[:60])); import os; print('exists=',os.path.exists(r'scratch_test\_diag_H1.exe')); p=subprocess.run([r'scratch_test\_diag_H1.exe'],capture_output=True,text=True,encoding='utf-8',errors='replace',timeout=15); print('run rc=',p.returncode,'out=',repr(p.stdout[:60]))"
            Write-Host "=== 虚拟内存检查: 不同 subprocess 模式对比 ==="
            python -c "
import subprocess, os
exe = r'scratch_test\_diag.exe'
# 模式1: capture_output (重定向 stdout)
try:
    p = subprocess.run([exe], capture_output=True, timeout=15)
    print('capture_output rc =', p.returncode)
except Exception as e:
    print('capture_output ERR:', e)
# 模式2: 不重定向 (继承父进程句柄)
try:
    p = subprocess.run([exe], timeout=15)
    print('inherit rc =', p.returncode)
except Exception as e:
    print('inherit ERR:', e)
# 模式3: stdin 重定向但 stdout 继承
try:
    p = subprocess.run([exe], stdin=subprocess.DEVNULL, timeout=15)
    print('stdin-only rc =', p.returncode)
except Exception as e:
    print('stdin-only ERR:', e)
# 模式4: stdout 重定向但 stderr 继承
try:
    p = subprocess.run([exe], stdout=subprocess.PIPE, timeout=15)
    print('stdout-pipe rc =', p.returncode)
except Exception as e:
    print('stdout-pipe ERR:', e)
"

      - name: 多 .o 链接 + jycc 验收 (6 项)
        run: python scripts/test_multifile.py

      - name: 自举三代不动点
        shell: powershell
        run: |
          qcc_x86.exe srclib_jiayan/qcc_work.jy -o v1.exe | Out-Null
          .\v1.exe srclib_jiayan/qcc_work.jy -o v2.exe | Out-Null
          .\v2.exe srclib_jiayan/qcc_work.jy -o v3.exe | Out-Null
          $h1 = (Get-FileHash v1.exe -Algorithm SHA256).Hash
          $h2 = (Get-FileHash v2.exe -Algorithm SHA256).Hash
          $h3 = (Get-FileHash v3.exe -Algorithm SHA256).Hash
          Write-Host "v1: $h1"
          Write-Host "v2: $h2"
          Write-Host "v3: $h3"
          if (($h1 -eq $h2) -and ($h2 -eq $h3)) { Write-Host "自举v2==v3 OK" } else { Write-Host "自举v2!=v3"; exit 1 }

      - name: 三核 H1==H2 逐字节 (asm_zh / qcc_rt / qcc_self)
        shell: python
        run: |
          import subprocess, hashlib
          subprocess.run(['gcc','-O2','-Wall','-Werror','srclib/asm_zh.c','-o','asm_zh.exe'], check=True)
          cores = [('asm_zh','srclib/asm_zh.c'),('qcc_rt','srclib/qcc_rt.c'),('qcc_self','srclib/qcc_x86.c')]
          for name, src in cores:
              subprocess.run(['qcc_x86.exe', src, '-o', f'{name}_H1.exe'], check=True)
              subprocess.run(['qcc_x86.exe','-S', src, '-o', name], check=True)
              subprocess.run(['asm_zh.exe', f'{name}.asm', '-o', f'{name}_H2.exe'], check=True)
              h1=hashlib.sha256(open(f'{name}_H1.exe','rb').read()).hexdigest()
              h2=hashlib.sha256(open(f'{name}_H2.exe','rb').read()).hexdigest()
              if h1!=h2: raise SystemExit(f'{name} H1!=H2: {h1} vs {h2}')
              print(f'{name} H1==H2 OK ({h1[:12]})')
