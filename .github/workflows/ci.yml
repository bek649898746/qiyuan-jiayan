# 启元甲言 CI — 每次 push/PR 自动验证闭环
# 验证: 编码闸 → 编译器自检 → 行为断言 → 多文件链接 | 中文链 90 秒自证 / 九线 / 全量中文特性锚
#       | 完整自举两代不动点 (v1==v2==$expected，schedule 触发)
#
# 2026-10-22 启元（审计）：全面脱离 C 版英文实现。
#   · 不再 gcc 现编 qcc_x86.exe —— C 版已封存为历史信任根，不再进 CI、不再维护。
#
#   ⚠️ 2026-10-27 启元（审计）修正：原文写「原样留在 jiayan-v1.0-stable 里可随时 checkout 复验」
#      是**错的**，实测（口径统一用 git blob = LF，`git cat-file -s <blob>`）：
#        · tag `jiayan-v1.0-stable` → commit 9d2d1f22（2026-08-24）
#          其 srclib/qcc_x86.c = blob e1f155c1b9 / **1,043,752 B**
#        · 真正封存的那份     = blob fff09635 / **1,874,904 B**
#        ⟹ tag 里只有封存版的 **55.7%**，不是被封存的那份。
#
#      ⚠️ 口径提醒（2026-10-27 复验）：`srclib/qcc_x86.c` 在**工作区磁盘上是 1,897,503 B（CRLF）**，
#         在 **git 里是 1,874,904 B（LF）**，差值 22,599 B = 行数（每行一枚 CR）。
#         比较两个 tag 的同一文件**必须都用 git blob**；拿磁盘体积去比 blob 是两种口径。
#
#   ✅ 封存版的实际位置：tag `jiayan-v1.0-sealed` → commit 54e237ff（2026-09-06）
#      其 srclib/qcc_x86.c = blob fff09635 / 1,874,904 B ⟹ `git checkout jiayan-v1.0-sealed`
#      即得完整原件（Windows 落盘为 1,897,503 B CRLF，同一份文件）。
#      ⚠️ 该 tag 目前**只在本地**，尚未 push 到 origin / GitHub。
#
#   · 定位澄清：qcc_x86.c **不是废弃代码，是 oracle / 独立验证**。
#     依据 scripts/build_zh.ps1 L4704：「qcc_x86（旧 frozen 英文）已无法编译当前规模中文源（死循环），
#     仅作 oracle/独立验证」。自举链是「自己编自己」，共谋性错误只有独立实现能抓到 ⟹ **保留，不下架**。
#     CodeQL 侧已把它排除（.github/codeql/codeql-config.yml）—— 只影响告警噪音，不影响 oracle 用途。
#   · 一律使用仓库自带的中文自举种子 qcc_zh_seed.exe（15 MB，随仓库分发，零依赖）。
#   · 删除了 asmzh job（其存在前提是「C 版汇编器 + C 版编译器」两套对拍，前提已失效）。
name: qiyuan-ci

on:
  push:
    branches: [ master, main, publish ]   # publish = 默认分支（补 2026-10-20）
  pull_request:
    branches: [ master, main, publish ]   # publish = 默认分支（补 2026-10-20）
  # ── 完整自举耗时长，不适合每次 push 跑，改为 nightly + 手动 ──
  #    这是全链唯一无法在 90 秒自证 / 九线 / 特性锚里覆盖的验收点：
  #    「v1 == v2 == $expected」只有真跑完两代自举才能判。
  schedule:
    - cron: '0 18 * * *'                  # 每天 UTC 18:00 = 北京时间 02:00
  workflow_dispatch:                       # 维护者手动触发（网页 Run workflow）

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 2026-10-22 启元（审计）：不再 gcc 现编 C 版 qcc_x86.exe。
      #   ⚠️ 2026-10-27 修正：原文说 C 版「原样留在 jiayan-v1.0-stable」—— **不实**。
      #      该 tag 里的 qcc_x86.c 只有 1,043,752 B（blob），是封存版（1,874,904 B）的 55.7%。
      #      完整原件在 tag `jiayan-v1.0-sealed`（commit 54e237ff）。详见文件头 §2026-10-27。
      #   仍不再维护：seed 切到自举不动点编译器后，它已无法编译当前规模的中文源（死循环）。
      #   但它**不是废弃代码**，是 oracle / 独立验证（见文件头「定位澄清」）。
      #   仓库自带的中文自举种子 qcc_zh_seed.exe（15 MB，随仓库分发）直接可用。
      - name: 编码检查 (源文件必须严格 UTF-8)
        run: python scripts/check_encoding.py .

      - name: 编译器自检（中文自举种子）
        run: .\qcc_zh_seed.exe --test

      # 2026-10-27 (施工单《负锚三缺口与选项接线判据》): `--serve` 从 ORPHAN 转 WIRED。
      #   原 `_verify_serve.py` 写法正确，但全仓零调用 ⟹ 测试存在、正确、从不执行。
      - name: 编译服务器 --serve 接线判据（ping / compile / quit）
        run: python scripts/check_serve.py

      # ── 行为断言：push/PR 只跑快速集，全量挪到 nightly ────────────────
      # 2026-10-21：全量测试串行跑一遍耗时很长，每次都跑偏重。
      # 快速集 30 个关键用例 19 秒，覆盖类型/布局/变参/控制流/指针/字符串/数组。
      # 全量在下方 nightly_full job（schedule / workflow_dispatch 才跑）。
      - name: 行为断言（快速集 · 全量在 nightly）
        run: python scripts/run_tests.py --fast

      - name: 多 .o 链接 + jycc 验收 (6 项)
        run: python scripts/test_multifile.py

  zh_chain:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # ── 中文主链验证（对外唯一推荐路径）──
      # 注：历史英文链 build.ps1 已从对外路径撤出 —— 它编译废弃镜像 qcc_work.jy，
      #     且在非仓库根目录会静默产出缺运行库的残缺编译器（rc 仍 0，运行即 0xC0000005）。
      #     详见 README「已知问题与口径说明」第 1 条。

      - name: 中文链 90 秒自证（零依赖 · 不需要 gcc）
        shell: powershell
        run: |
          # 2026-10-21 启元审计：原先直接内联调用，失败时日志只有 "Process completed with exit code 1"，
          # 审计方（无 token）读不到具体是哪一关 FAIL。改为捕获输出并用 ::error:: 打 annotation
          # —— annotation 可通过公开 API 匿名读取，等于把失败原因"外化"。
          $ErrorActionPreference = 'Continue'
          $out = (powershell -ExecutionPolicy Bypass -File scripts/verify_90s.ps1 2>&1 | Out-String)
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -ne 0) {
            $fails = ($out -split "`n" | Where-Object { $_ -match '\[FAIL\]' } | ForEach-Object { $_.Trim() }) -join ' ~ '
            if (-not $fails) { $fails = (($out -split "`n" | Where-Object { $_.Trim() -ne '' } | Select-Object -Last 6) -join ' ~ ') }
            # 诊断：**纯 ASCII**，不写任何中文字面量
            # —— 上一轮诊断因 ci.yml 里的中文被 GitHub 写成"无 BOM 的临时 .ps1"、
            #    PS5.1 在英文 runner 上按 ANSI(1252) 解码而乱码，导致 `成绩.jy存在=False`
            #    这个结论本身不可信（它查的是乱码路径）。本轮全部改用 Get-ChildItem 探测。
            $jys = @(Get-ChildItem examples -Filter *.jy -ErrorAction SilentlyContinue)
            $list = ($jys | ForEach-Object { $_.Name + ':' + $_.Length }) -join ','
            $diagOne = ''
            if ($jys.Count -gt 0) {
              $diagRaw = (& .\qcc_zh_seed.exe $jys[0].FullName -o '_diag.exe' 2>&1 | Out-String).Trim()
              $diagOne = ($diagRaw -split "`n" | Where-Object { $_.Trim() -ne '' } | Select-Object -First 3) -join ' ~ '
            }
            Write-Host "::error::verify_90s 失败 rc=$rc :: $fails :: [diag] examples_jy_count=$($jys.Count) list=[$list] CWD=$((Get-Location).Path) seed=$(Test-Path 'qcc_zh_seed.exe') :: $diagOne"
            exit 1
          }
          Write-Host "90 秒自证通过"

      - name: 九条语言线（85 文件归档 · 每线 1 个入口被编译运行 = 9/9）
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/verify_multilang.ps1

      # 2026-10-27 修正（审计侧）：这一步必须走 ci_zh_feat.ps1，不能直接调 run_tests_zh.py。
      #   ci_zh_feat.ps1 里做两件事：① 用中文种子编出 qcc_zh_v1.exe（当前主源产物）
      #   ② 用 v1 跑全量锚。少了 ① 就没有 qcc_zh_v1.exe，run_tests_zh.py 的守卫会响亮拒绝。
      #   ⟹ 全程中文路径：种子 → v1 → 锚。不碰任何英文实现。
      #   详见 scripts/ci_zh_feat.ps1 头部注释（那里记了为什么必须先编 v1）。
      - name: 中文特性锚（全量 feat_zh_*.c · 数量以 scripts/gate_baselines.json 为准）
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/ci_zh_feat.ps1

  tools:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: 种子在位检查
        shell: powershell
        run: |
          if (-not (Test-Path qcc_zh_seed.exe)) { Write-Host "::error::qcc_zh_seed.exe 不在仓库根目录"; exit 1 }
      - name: 工具链编译（甲言自己写的工具还能不能编）
        shell: powershell
        run: |
          # 2026-10-28 新增：tools/ 此前只存在于对外线、无任何 CI 覆盖，与主源兼容性从未回归。
          # 判据只到「能编译」——不跑工具本身（index/install/verify 已知实验性，见 tools/README.md）。
          $ErrorActionPreference = 'Continue'
          $fail = @()
          $targets = @(
            @{ d = 'tools\jypkg'; f = 'jy_pkg.jy' },
            @{ d = 'tools\jylsp'; f = 'jylsp.jy'  }
          )
          foreach ($t in $targets) {
            Push-Location $t.d
            $out = (& ..\..\qcc_zh_seed.exe $t.f -o "$env:TEMP\_tool.out.exe" 2>&1 | Out-String)
            $rc = $LASTEXITCODE
            Pop-Location
            Write-Host ("[{0}] rc={1} :: {2}" -f $t.f, $rc, ($out.Trim() -replace "`r?`n", ' | '))
            if ($rc -ne 0) { $fail += ("{0} rc={1}" -f $t.f, $rc) }
          }
          if ($fail.Count -gt 0) {
            Write-Host ("::error::工具链编译失败 :: " + ($fail -join ' ~ '))
            exit 1
          }
          Write-Host "tools build PASS"

  qemu:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5

      # 2026-10-22 启元：删掉「gcc 编 C 版」—— 本 job 从不用它（内核验证走 WSL/QEMU）。
      - name: WSL 安装 QEMU (渐进式, 失败不阻塞)
        continue-on-error: true
        run: wsl -e bash -c "sudo apt-get update && sudo apt-get install -y qemu-system-x86 binutils"

      - name: QEMU 内核验证 (NVMe 环回 LOOPBACK-PASS)
        continue-on-error: true
        run: wsl -e bash scripts/_qemu_kernel.sh kernel_v36
  # ══════════════════════════════════════════════════════════
  # 完整自举链 —— 全链唯一没被机器守护的验收点
  #
  # 为什么单独一个 job：跑一次要编两代 + 比不动点，耗时长，
  # 塞进 push/PR 会把每次提交都拖到 20 分钟以上 ⟹ 只在 nightly/手动跑。
  #
  # 它验的是什么（90 秒自证 / 九线 / 特性锚全都覆盖不到）：
  #   v1 = qcc_zh_seed.exe 编 qcc_zh.jy
  #   v2 = qcc_zh_v1.exe   编 qcc_zh.jy
  #   判据 = v1 == v2 == $expected（build_zh.ps1 内硬失败，不等即 exit 1）
  #
  # 前置：只需要仓库自带的 qcc_zh_seed.exe（15.2 MB）
  #   —— 不需要 gcc 编宿主：`build_zh.ps1` 里 qcc_x86.exe 引用数 = 0，
  #      头注释第 2 步「qcc_x86.exe (英文种子)」是 2026-08 的过时注释。
  #   —— 默认跳过 sinicize.py（只有显式 -Regenerate 才从英文镜像重建主源）。
  #
  # 内存实测（本机 2026-10-21）：主源单代编译峰值 2,021 MB / 45 秒（-c），
  #   windows-latest runner 有 7 GB ⟹ 够。public 仓库 Actions 时长不计费。
  # ══════════════════════════════════════════════════════════
  bootstrap:
    # 2026-10-27 (bootstrap P0): publish 的 push 也跑自举 —— 原条件让日常 push 的绿
    #   永远不含「编译器能自举」这一条（bootstrap/nightly_full 都被 skipped）。
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/publish')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: 种子在位检查
        shell: powershell
        run: |
          if (-not (Test-Path qcc_zh_seed.exe)) { Write-Host "[FAIL] qcc_zh_seed.exe 不在仓库根目录"; exit 1 }
          $len = (Get-Item qcc_zh_seed.exe).Length
          $sha = (Get-FileHash qcc_zh_seed.exe -Algorithm SHA256).Hash
          Write-Host "种子: $len 字节 / SHA256 $($sha.Substring(0,16))…"

      - name: 完整自举链（两代 + 不动点比对）
        shell: powershell
        run: |
          # 2026-10-27: 错误外化 —— 裸 exit 1 时审计方（无 token）拿不到任何原因。
          # 诊断串保持纯 ASCII（中文诊断会被 GitHub 写成无 BOM 临时 .ps1，PS5.1 按 ANSI 解码乱码）。
          $ErrorActionPreference = 'Continue'
          $out = (powershell -ExecutionPolicy Bypass -File scripts/build_zh.ps1 2>&1 | Out-String)
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -ne 0) {
            $fails = ($out -split "`n" | Where-Object { $_ -match '\[失败|\[FAIL|FAIL\]|ERROR|ERR\]|ParserError|Unexpected token' } | Select-Object -First 10 | ForEach-Object { $_.Trim() }) -join ' ~ '
            if (-not $fails) { $fails = (($out -split "`n" | Where-Object { $_.Trim() -ne '' } | Select-Object -Last 10) -join ' ~ ') }
            Write-Host "::error::build_zh failed rc=$rc :: $fails"
            exit 1
          }
          Write-Host "bootstrap chain PASS"

      - name: 两代产物取证（失败也上传，便于追因）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-v1-v2
          path: |
            qcc_zh_v1.exe
            qcc_zh_v2.exe
          retention-days: 14
          if-no-files-found: warn

  # ══════════════════════════════════════════════════════════
  # 行为断言 · 全量 —— 与 bootstrap 并行跑（不同 runner，互不干扰）
  #
  # 为什么单独一个 job：全量跑一遍耗时远超快速集，塞进 push/PR 会把
  # 每次提交都拖到 20 分钟以上 ⟹ push 只跑 --fast（30 个/19 秒）兜关键路径，
  # 全量放到 nightly 兜回归。
  #
  # 2026-10-21 修复前这个 job 的形态是「跑不完」：
  #   run_tests.py 用英文链 qcc_x86.exe 编 regress_adt_typed.c 挂死（CPU≈0），
  #   且编译调用没有 timeout ⟹ CI 白跑 4 小时 20 分。
  #   修完后中文链 377/377 全过，16.2 分钟。详见 scripts/run_tests.py 顶部注释。
  # ══════════════════════════════════════════════════════════
  nightly_full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 中文主链种子在位检查
        shell: powershell
        run: |
          if (-not (Test-Path qcc_zh_seed.exe)) { Write-Host "[FAIL] 缺 qcc_zh_seed.exe"; exit 1 }
          Write-Host "种子在: $((Get-Item qcc_zh_seed.exe).Length) 字节"

      # 2026-10-22 启元：test_multifile.py 已改用中文种子（QCC_TEST_BIN / qcc_zh_seed.exe 兜底），
      #   不再需要 gcc 现编 C 版。昨天为 D41 加的这行随之删除。

      - name: 行为断言全量（数量以 scripts/run_tests.py 为准）
        shell: powershell
        run: |
          # 2026-10-27: 错误外化（同 bootstrap）—— 失败时把 FAIL 行打成 ::error:: annotation。
          $ErrorActionPreference = 'Continue'
          $out = (python -X utf8 scripts/run_tests.py 2>&1 | Out-String)
          $rc = $LASTEXITCODE
          Write-Host $out
          if ($rc -ne 0) {
            $fails = ($out -split "`n" | Where-Object { $_ -match 'FAIL' } | Select-Object -First 15 | ForEach-Object { $_.Trim() }) -join ' ~ '
            if (-not $fails) { $fails = (($out -split "`n" | Where-Object { $_.Trim() -ne '' } | Select-Object -Last 8) -join ' ~ ') }
            Write-Host "::error::run_tests full failed rc=$rc :: $fails"
            exit 1
          }
          Write-Host "full assertions PASS"

      - name: 多 .o 链接 + jycc 验收
        run: python scripts/test_multifile.py


