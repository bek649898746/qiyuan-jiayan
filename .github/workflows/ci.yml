# 启元·甲言 CI — 每次 push/PR 自动验证闭环 (Task 3.3)
# 验证: 编译器构建 (gcc 零警告) → 行为断言 → 多 .o/jycc 验收 → 自举不动点
name: qiyuan-ci

on:
  push:
    branches: [ master, main, ci-fix ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'   # 临时改 3.11 验证: 3.12 subprocess 兼容性假设 (fix 2026-08-07)

      - name: 编译宿主编译器 (gcc 零警告)
        run: gcc -O2 -Wall -Werror srclib/qcc_x86.c -o qcc_x86.exe

      - name: 编码检查 (源文件必须严格 UTF-8)
        run: python scripts/check_encoding.py .

      - name: 编译器自检
        run: .\qcc_x86.exe --test

      - name: 行为断言 (180+)
        run: python scripts/run_tests.py

      - name: CI 诊断 (环境 + 失败详情) — 临时, 修绿后移除
        if: always()
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $diag = @()
          $diag += "=== gcc 版本 ==="
          $diag += (gcc --version | Select-Object -First 1)
          $diag += "=== Python 版本 ==="
          $diag += (python --version)
          $diag += "=== 编译 arg4.c ==="
          .\qcc_x86.exe tests/qcc/arg4.c -o scratch_test/_diag.exe 2>&1 | ForEach-Object { $diag += $_ }
          $diag += "编译 rc=$LASTEXITCODE"
          if (Test-Path scratch_test/_diag.exe) {
            $diag += "=== objdump PE 头 ==="
            objdump -x scratch_test/_diag.exe 2>&1 | Select-String -Pattern 'SizeOfImage|StackReserve|StackCommit|HeapReserve|entry|DLL Name' | ForEach-Object { $diag += $_.Line }
            $diag += "=== cmd 直接运行 ==="
            $out = cmd /c "scratch_test\_diag.exe & echo rc=%ERRORLEVEL%" 2>&1
            $diag += ($out -join ' | ')
            $diag += "=== subprocess 模式对比 (关键) ==="
            $pyout = python -c "import subprocess
exe = r'scratch_test\_diag.exe'
tests = [
  ('capture_output', dict(capture_output=True)),
  ('inherit', dict()),
  ('stdin-devnull', dict(stdin=subprocess.DEVNULL)),
  ('stdout-pipe', dict(stdout=subprocess.PIPE)),
  ('CREATE_NO_WINDOW', dict(creationflags=subprocess.CREATE_NO_WINDOW)),
  ('shell=True', dict(shell=True)),
]
for name, kw in tests:
    try:
        p = subprocess.run([exe], timeout=15, **kw)
        print(name, 'rc=', p.returncode)
    except Exception as e:
        print(name, 'ERR:', type(e).__name__, str(e)[:80])
"
            $pyout | ForEach-Object { $diag += $_ }
          }
          $diag | Set-Content -Path scratch_test/_ci_diag.txt -Encoding UTF8
          $diag | ForEach-Object { Write-Host $_ }
          # 同时写入 STEP_SUMMARY (PR 页面可见, 不依赖日志 API)
          $diag | Set-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Append

      - name: 上传诊断结果 (临时)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diag
          path: scratch_test/_ci_diag.txt
          if-no-files-found: ignore

      - name: 多 .o 链接 + jycc 验收 (6 项)
        run: python scripts/test_multifile.py

      - name: 自举三代不动点
        shell: powershell
        run: |
          qcc_x86.exe srclib_jiayan/qcc_work.jy -o v1.exe | Out-Null
          .\v1.exe srclib_jiayan/qcc_work.jy -o v2.exe | Out-Null
          .\v2.exe srclib_jiayan/qcc_work.jy -o v3.exe | Out-Null
          $h1 = (Get-FileHash v1.exe -Algorithm SHA256).Hash
          $h2 = (Get-FileHash v2.exe -Algorithm SHA256).Hash
          $h3 = (Get-FileHash v3.exe -Algorithm SHA256).Hash
          Write-Host "v1: $h1"
          Write-Host "v2: $h2"
          Write-Host "v3: $h3"
          if (($h1 -eq $h2) -and ($h2 -eq $h3)) { Write-Host "自举v2==v3 OK" } else { Write-Host "自举v2!=v3"; exit 1 }

      - name: 三核 H1==H2 逐字节 (asm_zh / qcc_rt / qcc_self)
        shell: python
        run: |
          import subprocess, hashlib
          subprocess.run(['gcc','-O2','-Wall','-Werror','srclib/asm_zh.c','-o','asm_zh.exe'], check=True)
          cores = [('asm_zh','srclib/asm_zh.c'),('qcc_rt','srclib/qcc_rt.c'),('qcc_self','srclib/qcc_x86.c')]
          for name, src in cores:
              subprocess.run(['qcc_x86.exe', src, '-o', f'{name}_H1.exe'], check=True)
              subprocess.run(['qcc_x86.exe','-S', src, '-o', name], check=True)
              subprocess.run(['asm_zh.exe', f'{name}.asm', '-o', f'{name}_H2.exe'], check=True)
              h1=hashlib.sha256(open(f'{name}_H1.exe','rb').read()).hexdigest()
              h2=hashlib.sha256(open(f'{name}_H2.exe','rb').read()).hexdigest()
              if h1!=h2: raise SystemExit(f'{name} H1!=H2: {h1} vs {h2}')
              print(f'{name} H1==H2 OK ({h1[:12]})')
