# ============================================================
# Gitee Go 流水线 —— 甲言 提交 / PR 自动校验
#
# 【为什么要有这个文件】
#   本项目的 GitHub Actions 配置（.github/workflows/ci.yml）写在 GitHub 上，
#   而 GitHub 在当前网络环境下不可达；真正对外发布的发布线是 **Gitee**，
#   但 Gitee 侧此前没有任何 CI ⟹ 等于**完全没有守门**。
#   后果（实测）：scripts/build.ps1 里写死的不动点滞后 44 天无人发现，
#   导致任何用户 clone 后照文档跑都看到假 FAIL 并当场中断。
#
# 【等价本地入口】（不依赖任何 CI 平台，随时可跑）
#   powershell -ExecutionPolicy Bypass -File scripts/verify_all.ps1
#
# ⚠️ 注：Gitee Go 的流水线语法随版本演进，且执行环境以 Linux 为主。
#    若本文件与当前 Gitee Go 版本不匹配（或需要 Windows runner），
#    请在 Gitee 仓库「流水线」页面按向导重建，并保持调用同一个入口脚本
#    scripts/verify_all.ps1 —— 校验逻辑只维护一处，平台配置只是外壳。
# ============================================================
version: 1.0
name: qiyuan-ci
displayName: 甲言 CI（编码闸 + 自举收敛 + 测试）

triggers:
  push:
    branches:
      include:
        - main
        - master
  pull_request:
    branches:
      include:
        - main
        - master

stages:
  - stage:
      name: verify
      displayName: 全量校验
      steps:
        - step: execute
          name: encoding_gate
          displayName: 编码闸（.ps1 必须 UTF-8 BOM；源码须严格 UTF-8）
          script: |
            # ⚠️ 历史英文链 build.ps1 / verify_all.ps1 已从对外验证路径撤出：
            #    它们编译废弃镜像 qcc_work.jy，且在非仓库根目录会静默产出缺运行库的残缺编译器。
            #    详见 README「已知问题与口径说明」第 1 条。
            powershell -ExecutionPolicy Bypass -File scripts/verify_90s.ps1

        - step: execute
          name: multilang
          displayName: 九条语言线（85 文件归档 · 每线 1 个入口被编译运行 = 9/9）
          script: |
            powershell -ExecutionPolicy Bypass -File scripts/verify_multilang.ps1
